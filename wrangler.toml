# Deploy: npx wrangler login && npx wrangler deploy
# Secrets: npx wrangler secret put ORIGIN_AUTH
# Optional: set account_id in Dashboard → Workers → copy id (do not commit real IDs in forks)

name = "cstv"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Non-secret tunables (override in dashboard or wrangler.toml copy)
[vars]
SYNC_FRAGMENT_DELAY = "8"
SYNC_CACHE_MAX_AGE = "3"
# SYNC_NOT_READY_USE_404 = "false"  # set "true" for gotv-plus-go style 404 instead of 405
# TOKEN_REDIRECT = ""               # optional global playcast token_redirect segment (VDC)

[[durable_objects.bindings]]
name = "GOTV"
class_name = "GotvMatch"

[[migrations]]
tag = "v1"
new_classes = ["GotvMatch"]
